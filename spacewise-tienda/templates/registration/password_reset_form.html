{% extends "registration/_auth.html" %}
{% block title %}¿Olvidaste tu contraseña?{% endblock %}
{% block box %}
<form method="post" novalidate>
  {% csrf_token %}
  <h2>¿Olvidaste tu contraseña?</h2>
  <p class="muted" style="margin:0 0 20px;font-size:12px">Escribe el correo con el que inicias sesión.</p>
  <div class="field">
    <label for="{{ form.email.id_for_label }}">Correo electrónico</label>
    <input type="email" name="email" id="{{ form.email.id_for_label }}" placeholder="tu@correo.cl" autocomplete="email" required autofocus value="{{ form.email.value|default:'' }}">
    {{ form.email.errors }}
  </div>
  <button class="btn btn-accent" type="submit">Enviar enlace</button>
</form>
{% endblock %}
