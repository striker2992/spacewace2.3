# Configuración de Nginx como Balanceador de Carga y Reverse Proxy para Gunicorn
# Copiar este archivo a /etc/nginx/sites-available/spacewise en Ubuntu 22.04:
#   sudo cp deploy/nginx-spacewise.conf /etc/nginx/sites-available/spacewise
#   sudo ln -sf /etc/nginx/sites-available/spacewise /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream gunicorn_backend {
    # Algoritmo de balanceo: least_conn envía cada petición al worker/instancia con menor carga activa
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Tamaño máximo de subida para fotos de contenedores
    client_max_body_size 25M;

    # Logs de acceso y errores
    access_log /var/log/nginx/spacewise_access.log;
    error_log /var/log/nginx/spacewise_error.log;

    # Balanceo y paso hacia Gunicorn
    location / {
        proxy_pass http://gunicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para procesos largos (reportes/PDFs)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

