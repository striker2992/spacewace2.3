# Configuración de Nginx para SpaceWise con Docker
# Copiar este archivo a /etc/nginx/sites-available/spacewise en Ubuntu 22.04:
#   sudo cp deploy/nginx-spacewise.conf /etc/nginx/sites-available/spacewise
#   sudo ln -s /etc/nginx/sites-available/spacewise /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com; # o la IP del servidor si no hay dominio

    # Tamaño máximo de subida para fotos de contenedores
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/spacewise_access.log;
    error_log /var/log/nginx/spacewise_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
